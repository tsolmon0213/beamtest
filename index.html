<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEAM</title>
<style>
  @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }
  html, body { margin: 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div style="width:100vw;min-height:100vh;background:oklch(0.22 0.09 290);display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:'Manrope',sans-serif;position:relative;box-sizing:border-box;padding:24px;">
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 38%, oklch(0.28 0.1 290) 0%, oklch(0.22 0.09 290) 60%);"></div>

  <div style="flex:1;"></div>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:28px;max-width:90vw;">
    <img src="uploads/beam-pfp.jpg" alt="Beam logo" style="width:min(180px,32vw);height:min(180px,32vw);border-radius:28px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,0.35);" />

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:0.04em;color:oklch(0.97 0.01 290);line-height:1;">BEAM</div>
      <div style="font-size:clamp(14px,2vw,18px);font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:oklch(0.78 0.05 85);">Site under construction</div>
    </div>

    <div style="font-size:clamp(15px,1.8vw,18px);color:oklch(0.85 0.02 290);text-align:center;max-width:520px;line-height:1.6;">
      Our new home is on the way. In the meantime, chapters can find everything they need below.
    </div>

    <div style="margin-top:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;">
      <a href="/chapters/" style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:100px;background:oklch(0.78 0.14 85);color:oklch(0.18 0.06 290);font-weight:700;font-size:16px;text-decoration:none;">
        Chapter Resources
      </a>
    </div>
  </div>

  <div style="position:relative;flex:1;display:flex;align-items:flex-end;padding-top:24px;font-size:13px;letter-spacing:0.08em;color:oklch(0.55 0.03 290);text-transform:uppercase;">&copy; 2026 Beam</div>
</div>
</body>
</html>
