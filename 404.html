<script>
  // Page addresses are lowercase. If someone typed capitals (e.g. /UniRules),
  // send them to the lowercase address instead of showing an error.
  (function () {
    var lower = location.pathname.toLowerCase();
    if (lower !== location.pathname) {
      location.replace(lower + location.search + location.hash);
    }
  })();
</script>
